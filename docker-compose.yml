version: '3.8'

services:
  # ----------------------------------------------------
  # Semantic Caching & Rate Limiting Backend
  # ----------------------------------------------------
  redis:
    image: redis/redis-stack:latest
    container_name: ai-redis
    ports:
      - "6379:6379"
      - "8001:8001" # RedisInsight UI
    environment:
      - REDIS_ARGS=--requirepass secretpassword

  # ----------------------------------------------------
  # Vector Database for Streaming RAG
  # ----------------------------------------------------
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: ai-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=streaming_rag
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ----------------------------------------------------
  # Message Queue for Agent Orchestrator
  # ----------------------------------------------------
  nats:
    image: nats:latest
    container_name: ai-nats
    ports:
      - "4222:4222" # Client Port
      - "8222:8222" # HTTP Management Port

volumes:
  pgdata:
